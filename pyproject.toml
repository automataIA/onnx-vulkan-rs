[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "onnx-vulkan-pipeline"
version = "0.1.0"
description = "Verified ONNX preparation and Vulkan optimization experiments"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "onnx>=1.17", "onnxruntime>=1.23", "onnxscript>=0.3"]

[project.optional-dependencies]
torch = ["torch>=2.6"]
test = ["pytest>=8"]

[project.scripts]
onnx-vulkan = "onnx_vulkan_pipeline.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["python/onnx_vulkan_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]

