[package]
name = "model-runner"
version.workspace = true
edition.workspace = true
publish = false

[[bin]]
name = "model-runner"
path = "src/main.rs"

[dependencies]
ort = { version = "=2.0.0-rc.10", default-features = false, features = ["load-dynamic", "std"] }
anyhow = { workspace = true }
log = { workspace = true }
env_logger = { workspace = true }
# to read the TensorProtos of the `test_data_set_*`: the same parser as the engine
onnx-vulkan-core = { path = "../onnx-vulkan-core" }
onnx-vulkan-frontend = { path = "../onnx-vulkan-frontend" }
# the standalone engine, for the parity mode: same graph, same kernels, no ORT
onnx-vulkan = { path = "../onnx-vulkan" }
# only to dump the profiler after a standalone run: nothing else does it, since
# the Pareto is normally printed by the plugin's `OnRunEnd`
vk-compute = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
ep-registry = { workspace = true }
